<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent keys</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f6f7f9; color: #111; }
    header { background: #111; color: #fff; }
    nav { max-width: 1100px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .brand { color: #fff; font-weight: 700; text-decoration: none; }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
    h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 8px; }
    p { color: #444; }
    .card { background: #fff; border: 1px solid #e6e6e6; padding: 20px; margin: 16px 0; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd; font: inherit; }
    button { background: #111; color: #fff; border: none; padding: 12px 18px; font-weight: 700; cursor: pointer; margin-top: 12px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; vertical-align: top; }
    th { font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; color: #666; }
    .wide { color: #c0392b; font-weight: 700; }
    .ok { color: #1e7e34; font-weight: 700; }
    .error { color: #c0392b; }
    footer { background: #111; color: #bbb; margin-top: 40px; }
    .foot { max-width: 1100px; margin: 0 auto; padding: 20px 24px; }
  </style>
</head>
<body>
  <header><nav><a class="brand" href="/">Agent keys</a></nav></header>
  <main>
    <h1>Which keys can an agent use</h1>
    <p>Paste a GitHub token. This lists the fine-grained tokens and SSH keys on that account, and marks the ones that can write or administer.</p>
    <div class="card">
      <label for="token">GitHub token</label>
      <input id="token" type="password" placeholder="github_pat_... or ghp_...">
      <button onclick="load()">List keys</button>
      <p id="status"></p>
    </div>
    <div id="out"></div>
  </main>
  <footer><div class="foot">Agent keys · 2026</div></footer>
  <script>
    async function load() {
      const token = document.getElementById('token').value.trim();
      const status = document.getElementById('status');
      const out = document.getElementById('out');
      if (!token) { status.innerHTML = '<span class="error">Token is required.</span>'; return; }
      status.textContent = 'Reading keys...';
      out.innerHTML = '';
      try {
        const res = await fetch('/api/keys', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed');
        status.textContent = data.user + ' · ' + data.count + ' keys';
        if (data.pat_error) status.innerHTML += '<br><span class="error">Token list: ' + data.pat_error + '</span>';
        if (!data.keys.length) { out.innerHTML = '<p>No fine-grained tokens or SSH keys found.</p>'; return; }
        let html = '<table><tr><th>Kind</th><th>Name</th><th>Owner</th><th>Access</th><th>Expires</th><th>Verdict</th></tr>';
        for (const k of data.keys) {
          html += '<tr><td>' + k.kind + '</td><td>' + (k.name || '') + '</td><td>' + (k.owner || '') + '</td><td>' + (k.permissions || []).join('<br>') + '</td><td>' + (k.expires || '—') + '</td><td class="' + (k.wide ? 'wide' : 'ok') + '">' + (k.wide ? 'Too wide' : 'Limited') + '</td></tr>';
        }
        html += '</table>';
        out.innerHTML = html;
      } catch (err) {
        status.innerHTML = '<span class="error">' + err.message + '</span>';
      }
    }
  </script>
</body>
</html>
